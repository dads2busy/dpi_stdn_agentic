[project]
name = "stdn-agentic"
version = "0.1.0"
description = "Supply Technology Dependency Network (STDN) generation using Pydantic AI agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-ai>=0.0.14",
    "pandas>=2.0.0",
    "ollama>=0.3.0",
]

[project.scripts]
stdn = "stdn_agentic.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stdn_agentic"]

